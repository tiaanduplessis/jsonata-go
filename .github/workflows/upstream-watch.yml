name: Upstream compatibility watch

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare upstream release, tests, and advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-upstream.sh
      - name: Open an explicit compatibility review
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/upstream-compatibility-review
          delete-branch: true
          commit-message: 'chore: review upstream JSONata changes'
          title: 'Review upstream JSONata compatibility changes'
          body: |
            The upstream-watch job detected a release, test, or advisory change.

            Review `.github/upstream-review.md` and update the pinned target only after maintainer approval. This automation does not change the target silently.
          add-paths: .github/upstream-review.md
