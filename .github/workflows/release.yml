name: Tagged release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify with Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify the release gates
        run: make release-verify VERSION=${GITHUB_REF_NAME}
      - name: Preserve audited benchmark evidence
        if: matrix.go == '1.27.x'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-benchmark-evidence
          path: |
            reports/benchmark/report.json
            reports/benchmark/README.md
            reports/benchmark/benchstat.txt
          if-no-files-found: error

  package:
    name: Package and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Download audited benchmark evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-benchmark-evidence
          path: reports/benchmark
      - name: Create reproducible archive and API documentation
        run: .github/scripts/create-release-artifacts.sh "${GITHUB_REF_NAME}" dist
      - name: Require a signed annotated tag object
        run: |
          set -eu
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          git cat-file tag "refs/tags/${GITHUB_REF_NAME}" | grep -E -- '-----BEGIN (PGP|SSH) SIGNATURE-----' >/dev/null
      - name: Validate the public module proxy
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          set -eu
          module=$(go list -m -f '{{.Path}}')
          temporary_directory=$(mktemp -d)
          trap 'rm -rf "$temporary_directory"' EXIT HUP INT TERM
          cd "$temporary_directory"
          go mod init release-verifier >/dev/null
          for attempt in 1 2 3 4 5; do
            if go mod download -json "$module@${GITHUB_REF_NAME}" >"${GITHUB_WORKSPACE}/dist/module-proxy.json"; then
              test -s "${GITHUB_WORKSPACE}/dist/module-proxy.json"
              exit 0
            fi
            sleep 15
          done
          echo 'the public module proxy did not resolve the tagged module' >&2
          exit 1
      - name: Bind proxy metadata into the checksum manifest
        run: |
          set -eu
          (cd dist && sha256sum ./*.tar.gz api-docs.txt conformance-report.json benchmark-report.json benchmark-report.md benchmark-benchstat.txt module-proxy.json) >dist/checksums.txt
      - name: Sign the checksum file
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create keyless checksum signature
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.sig \
            --bundle dist/checksums.sigstore.json \
            dist/checksums.txt
      - name: Attest release subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/api-docs.txt
      - name: Publish the existing tag
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        # This job runs after the tag push. The mandatory pre-release workflow
        # is the gate before tag creation; this workflow only revalidates and
        # packages the already-published module tag.
        run: |
          set -eu
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
          fi
